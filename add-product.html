<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Builder — Store Preview</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/index.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #6C5CE7;
            --primary-light: #A29BFE;
            --primary-dark: #5A4BD1;
            --bg: #F8F9FC;
            --card-bg: #FFFFFF;
            --text-primary: #1A1A2E;
            --text-secondary: #6B7280;
            --text-muted: #9CA3AF;
            --border: #E5E7EB;
            --border-focus: #6C5CE7;
            --success: #10B981;
            --danger: #EF4444;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.1);
            --shadow-xl: 0 20px 50px rgba(0,0,0,0.12);
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Header */
        .header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.9);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .header-badge {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        /* Main Layout */
        .main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            min-height: calc(100vh - 69px);
        }

        /* Form Panel */
        .form-panel {
            padding: 32px;
            overflow-y: auto;
            max-height: calc(100vh - 69px);
            border-right: 1px solid var(--border);
        }

        .form-section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        /* Card Style Selector */
        .style-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        .style-option {
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            background: var(--card-bg);
            position: relative;
        }

        .style-option:hover {
            border-color: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .style-option.active {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(108,92,231,0.04), rgba(162,155,254,0.04));
            box-shadow: 0 0 0 3px rgba(108,92,231,0.12);
        }

        .style-option.active::after {
            content: '✓';
            position: absolute;
            top: 6px;
            right: 8px;
            width: 20px;
            height: 20px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .style-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 10px;
            background: var(--bg);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: all 0.25s ease;
        }

        .style-option.active .style-icon {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            transform: scale(1.05);
        }

        .style-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .style-desc {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.3;
        }

        /* Form Fields */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .form-label span {
            color: var(--text-muted);
            font-weight: 400;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--card-bg);
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108,92,231,0.1);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-divider {
            height: 1px;
            background: var(--border);
            margin: 28px 0;
        }

        .emoji-input-wrapper {
            position: relative;
        }

        .emoji-input-wrapper .form-input {
            padding-left: 44px;
            font-size: 18px;
        }

        .emoji-input-wrapper .emoji-preview {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
        }

        /* Preview Panel */
        .preview-panel {
            padding: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #F0EDFF 0%, var(--bg) 100%);
            position: relative;
            overflow: hidden;
        }

        .preview-panel::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(108,92,231,0.03) 0%, transparent 50%);
            pointer-events: none;
        }

        .preview-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-label::before,
        .preview-label::after {
            content: '';
            width: 20px;
            height: 1px;
            background: var(--border);
        }

        .preview-container {
            width: 100%;
            max-width: 380px;
            position: relative;
            z-index: 1;
        }

        /* Store Mockup Frame */
        .store-frame {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.06);
        }

        .store-frame-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .store-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .store-dot:nth-child(1) { background: #FF6B6B; }
        .store-dot:nth-child(2) { background: #FECA57; }
        .store-dot:nth-child(3) { background: #48DBFB; }

        .store-frame-url {
            flex: 1;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 6px;
            margin-left: 8px;
        }

        .store-frame-body {
            padding: 24px 20px;
        }

        /* ==================== */
        /* BUTTON CARD STYLE    */
        /* ==================== */
        .card-button {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
        }

        .card-button:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .card-button .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .card-button .card-price-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .card-button .card-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .card-button .card-compare-price {
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .card-button .card-cta {
            width: 100%;
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
        }

        .card-button .card-cta:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(108,92,231,0.3);
            filter: brightness(0.92);
        }

        /* ==================== */
        /* CALLOUT CARD STYLE   */
        /* ==================== */
        .card-callout {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
            position: relative;
        }

        .card-callout:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .card-callout .callout-emoji {
            width: 64px;
            height: 64px;
            min-width: 64px;
            background: linear-gradient(135deg, rgba(108,92,231,0.08), rgba(162,155,254,0.12));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .card-callout .callout-content {
            flex: 1;
            min-width: 0;
        }

        .card-callout .callout-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2px;
            line-height: 1.3;
        }

        .card-callout .callout-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .card-callout .callout-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .card-callout .callout-prices {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-callout .callout-price {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .card-callout .callout-compare {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .card-callout .callout-cta {
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .card-callout .callout-cta:hover {
            filter: brightness(0.92);
        }

        /* ==================== */
        /* PREVIEW CARD STYLE   */
        /* ==================== */
        .card-preview {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .card-preview:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .card-preview .preview-emoji {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(108,92,231,0.08), rgba(162,155,254,0.15));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 20px;
        }

        .card-preview .preview-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .card-preview .preview-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .card-preview .preview-prices {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .card-preview .preview-price {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .card-preview .preview-compare {
            font-size: 15px;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .card-preview .preview-cta {
            width: 100%;
            padding: 14px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
        }

        .card-preview .preview-cta:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(108,92,231,0.3);
            filter: brightness(0.92);
        }

        /* Image upload area */
        .image-upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--bg);
        }

        .image-upload-area:hover {
            border-color: var(--primary-light);
            background: rgba(108,92,231,0.02);
        }

        .image-upload-area.has-image {
            padding: 8px;
            border-style: solid;
            border-color: var(--primary);
        }

        .image-upload-area .upload-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .image-upload-area .upload-text {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .image-upload-area .upload-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .image-upload-area img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .preview-container {
            animation: fadeInUp 0.4s ease;
        }

        .card-transition {
            animation: fadeInUp 0.3s ease;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .main {
                grid-template-columns: 1fr;
            }
            .form-panel {
                max-height: none;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .preview-panel {
                min-height: 500px;
            }
        }

        @media (max-width: 500px) {
            .form-panel, .preview-panel {
                padding: 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar */
        .form-panel::-webkit-scrollbar {
            width: 6px;
        }
        .form-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        .form-panel::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* Hidden file input */
        .hidden-input {
            display: none;
        }

        /* Color picker row */
        .color-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-picker {
            width: 36px;
            height: 36px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            padding: 2px;
            background: var(--card-bg);
        }

        .color-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker::-webkit-color-swatch {
            border: none;
            border-radius: 5px;
        }

        .color-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Toggle switch */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }

        .toggle-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .toggle {
            width: 44px;
            height: 24px;
            background: var(--border);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle.active {
            background: var(--primary);
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .toggle.active::after {
            left: 22px;
        }

        /* Badge */
        .card-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 0.3px;
            z-index: 2;
        }

        .card-badge.red { background: #FF6B6B; }
        .card-badge.green { background: var(--success); }
        .card-badge.blue { background: #4DABF7; }
        .card-badge.orange { background: #FF922B; }

        .badge-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .badge-input-row .form-input {
            flex: 1;
        }

        .badge-color-select {
            width: 36px;
            height: 36px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            padding: 2px;
            background: var(--card-bg);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="header-logo">S</div>
            <div>
                <div class="header-title">Product Card Builder</div>
                <div class="header-subtitle">Design your store product cards</div>
            </div>
        </div>
        <div class="header-badge">LIVE PREVIEW</div>
    </header>

    <!-- Main -->
    <div class="main">
        <!-- Form Panel -->
        <div class="form-panel">
            <!-- Card Style Selector -->
            <div class="form-section-title">Card Style</div>
            <div class="style-selector">
                <div class="style-option active" data-style="button" onclick="selectStyle('button')">
                    <div class="style-icon">▭</div>
                    <div class="style-name">Button</div>
                    <div class="style-desc">Title, price & CTA</div>
                </div>
                <div class="style-option" data-style="callout" onclick="selectStyle('callout')">
                    <div class="style-icon">☰</div>
                    <div class="style-name">Callout</div>
                    <div class="style-desc">Horizontal layout</div>
                </div>
                <div class="style-option" data-style="preview" onclick="selectStyle('preview')">
                    <div class="style-icon">▢</div>
                    <div class="style-name">Preview</div>
                    <div class="style-desc">Centered vertical</div>
                </div>
            </div>

            <div class="form-divider"></div>

            <!-- Product Details -->
            <div class="form-section-title">Product Details</div>

            <div class="form-group">
                <label class="form-label">Title</label>
                <input type="text" class="form-input" id="inputTitle" placeholder="e.g. Premium Course Bundle" value="Premium Course Bundle" oninput="updatePreview()">
            </div>

            <div class="form-group" id="subtitleGroup" style="display:none;">
                <label class="form-label">Subtitle <span>(Callout & Preview only)</span></label>
                <input type="text" class="form-input" id="inputSubtitle" placeholder="e.g. Learn everything from scratch" value="Learn everything from scratch" oninput="updatePreview()">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Price</label>
                    <input type="text" class="form-input" id="inputPrice" placeholder="$49.00" value="$49" oninput="updatePreview()">
                </div>
                <div class="form-group">
                    <label class="form-label">Compare at Price <span>(optional)</span></label>
                    <input type="text" class="form-input" id="inputComparePrice" placeholder="$99.00" value="$99" oninput="updatePreview()">
                </div>
            </div>

            <div class="form-divider"></div>

            <!-- CTA -->
            <div class="form-section-title">Call to Action</div>

            <div class="form-group">
                <label class="form-label">Button Text</label>
                <input type="text" class="form-input" id="inputCta" placeholder="e.g. Get Instant Access" value="Get Instant Access" oninput="updatePreview()">
            </div>

            <!-- Badge -->
            <div class="form-group">
                <div class="toggle-row">
                    <span class="toggle-label">Show Badge</span>
                    <div class="toggle active" id="badgeToggle" onclick="toggleBadge()"></div>
                </div>
            </div>

            <div id="badgeFields">
                <div class="form-group">
                    <label class="form-label">Badge Text</label>
                    <div class="badge-input-row">
                        <input type="text" class="form-input" id="inputBadge" placeholder="e.g. BESTSELLER" value="BESTSELLER" oninput="updatePreview()">
                        <select class="badge-color-select" id="badgeColor" onchange="updatePreview()">
                            <option value="red">🔴</option>
                            <option value="green">🟢</option>
                            <option value="blue">🔵</option>
                            <option value="orange">🟠</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-divider"></div>

            <!-- Media -->
            <div class="form-section-title" id="mediaSectionTitle" style="display:none;">Icon / Emoji</div>

            <div class="form-group" id="emojiGroup" style="display:none;">
                <label class="form-label">Emoji / Icon</label>
                <div class="emoji-input-wrapper">
                    <span class="emoji-preview" id="emojiPreviewDisplay">🚀</span>
                    <input type="text" class="form-input" id="inputEmoji" placeholder="🚀" value="🚀" maxlength="4" oninput="updatePreview()">
                </div>
            </div>

            <div class="form-divider" id="customDivider"></div>

            <!-- Button Color -->
            <div class="form-section-title">Customization</div>

            <div class="form-group">
                <label class="form-label">Button Color</label>
                <div class="color-row">
                    <input type="color" class="color-picker" id="inputBtnColor" value="#6C5CE7" oninput="updatePreview()">
                    <span class="color-label" id="colorLabel">#6C5CE7</span>
                </div>
            </div>
        </div>

        <!-- Preview Panel -->
        <div class="preview-panel">
            <div class="preview-label">STORE PREVIEW</div>
            <div class="preview-container" id="previewContainer">
                <!-- Cards rendered here by JS -->
            </div>
        </div>
    </div>

    <script>
        let currentStyle = 'button';
        let showBadge = true;

        function selectStyle(style) {
            currentStyle = style;
            document.querySelectorAll('.style-option').forEach(el => {
                el.classList.toggle('active', el.dataset.style === style);
            });

            const subtitleGroup = document.getElementById('subtitleGroup');
            const emojiGroup = document.getElementById('emojiGroup');
            const mediaSectionTitle = document.getElementById('mediaSectionTitle');

            if (style === 'button') {
                subtitleGroup.style.display = 'none';
                emojiGroup.style.display = 'none';
                mediaSectionTitle.style.display = 'none';
            } else {
                subtitleGroup.style.display = 'block';
                emojiGroup.style.display = 'block';
                mediaSectionTitle.style.display = 'block';
                mediaSectionTitle.textContent = 'Icon / Emoji';
            }

            updatePreview();
        }

        function toggleBadge() {
            showBadge = !showBadge;
            document.getElementById('badgeToggle').classList.toggle('active', showBadge);
            document.getElementById('badgeFields').style.display = showBadge ? 'block' : 'none';
            updatePreview();
        }

        function getValues() {
            return {
                title: document.getElementById('inputTitle').value || 'Product Title',
                subtitle: document.getElementById('inputSubtitle').value || 'Product subtitle text',
                price: document.getElementById('inputPrice').value || '$0',
                comparePrice: document.getElementById('inputComparePrice').value,
                cta: document.getElementById('inputCta').value || 'Buy Now',
                emoji: document.getElementById('inputEmoji').value || '🚀',
                badge: document.getElementById('inputBadge').value || 'NEW',
                badgeColor: document.getElementById('badgeColor').value,
                btnColor: document.getElementById('inputBtnColor').value
            };
        }

        function buildBadgeHTML(v, positionStyle) {
            if (!showBadge || !v.badge) return '';
            return `<div class="card-badge ${v.badgeColor}" style="${positionStyle}">${v.badge}</div>`;
        }

        function updatePreview() {
            const v = getValues();
            const container = document.getElementById('previewContainer');
            document.getElementById('colorLabel').textContent = v.btnColor;
            document.getElementById('emojiPreviewDisplay').textContent = v.emoji;

            let compareHTML = (priceClass, compareClass) => {
                if (!v.comparePrice) return '';
                return `<span class="${compareClass}">${v.comparePrice}</span>`;
            };

            let cardHTML = '';

            if (currentStyle === 'button') {
                cardHTML = `
                    <div class="store-frame">
                        <div class="store-frame-header">
                            <div class="store-dot"></div>
                            <div class="store-dot"></div>
                            <div class="store-dot"></div>
                            <div class="store-frame-url">yourstore.com</div>
                        </div>
                        <div class="store-frame-body">
                            <div class="card-button card-transition">
                                ${buildBadgeHTML(v, 'top:12px;left:12px;')}
                                <div class="card-title">${v.title}</div>
                                <div class="card-price-row">
                                    <span class="card-price">${v.price}</span>
                                    ${compareHTML('card-compare-price', 'card-compare-price')}
                                </div>
                                <button class="card-cta" style="background:${v.btnColor};">${v.cta}</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentStyle === 'callout') {
                cardHTML = `
                    <div class="store-frame">
                        <div class="store-frame-header">
                            <div class="store-dot"></div>
                            <div class="store-dot"></div>
                            <div class="store-dot"></div>
                            <div class="store-frame-url">yourstore.com</div>
                        </div>
                        <div class="store-frame-body">
                            <div class="card-callout card-transition">
                                ${buildBadgeHTML(v, 'top:-8px;left:-8px;')}
                                <div class="callout-emoji">${v.emoji}</div>
                                <div class="callout-content">
                                    <div class="callout-title">${v.title}</div>
                                    <div class="callout-subtitle">${v.subtitle}</div>
                                    <div class="callout-bottom">
                                        <div class="callout-prices">
                                            <span class="callout-price">${v.price}</span>
                                            ${v.comparePrice ? `<span class="callout-compare">${v.comparePrice}</span>` : ''}
                                        </div>
                                        <button class="callout-cta" style="background:${v.btnColor};">${v.cta}</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentStyle === 'preview') {
                cardHTML = `
                    <div class="store-frame">
                        <div class="store-frame-header">
                            <div class="store-dot"></div>
                            <div class="store-dot"></div>
                            <div class="store-dot"></div>
                            <div class="store-frame-url">yourstore.com</div>
                        </div>
                        <div class="store-frame-body">
                            <div class="card-preview card-transition">
                                ${buildBadgeHTML(v, 'top:12px;right:12px;left:auto;')}
                                <div class="preview-emoji">${v.emoji}</div>
                                <div class="preview-title">${v.title}</div>
                                <div class="preview-subtitle">${v.subtitle}</div>
                                <div class="preview-prices">
                                    <span class="preview-price">${v.price}</span>
                                    ${v.comparePrice ? `<span class="preview-compare">${v.comparePrice}</span>` : ''}
                                </div>
                                <button class="preview-cta" style="background:${v.btnColor};">${v.cta}</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = cardHTML;
        }

        // Initialize
        selectStyle('button');
    </script>
</body>
</html>
